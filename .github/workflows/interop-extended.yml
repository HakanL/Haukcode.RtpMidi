name: Interop Extended

# Triggered manually (with optional external peer inputs) or on a nightly schedule.
# All jobs are independent so failures in one do not block the others.

on:
  workflow_dispatch:
    inputs:
      peer_host:
        description: >
          IP or hostname of an external RTP-MIDI peer (e.g. macOS machine, rtpMIDI on Windows).
          Leave empty to run self-interop only.
        required: false
        default: ''
      peer_port:
        description: 'Control port of the external peer (default: 5004)'
        required: false
        default: '5004'
      peer_label:
        description: 'Human-readable label for the peer shown in job names and results'
        required: false
        default: 'external-peer'
  schedule:
    # Nightly at 02:00 UTC — self-interop runs automatically
    - cron: '0 2 * * *'

defaults:
  run:
    working-directory: src

jobs:
  # ---------------------------------------------------------------------------
  # Self-interop: our loopback server + client (all 14 checks)
  # Runs on every platform to catch OS-specific networking differences.
  # ---------------------------------------------------------------------------
  interop-extended-self:
    name: Extended self-interop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build InteropTest
      run: dotnet build ../tests/RtpMidi.InteropTest --configuration Release
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Start InteropTest server (background)
      shell: bash
      run: |
        dotnet run --project ../tests/RtpMidi.InteropTest --configuration Release --no-build -- \
          server --port 5004 &
        echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        sleep 3

    - name: Run extended client (all 14 checks, loopback)
      shell: bash
      run: |
        dotnet run --project ../tests/RtpMidi.InteropTest --configuration Release --no-build -- \
          client --host 127.0.0.1 --port 5004 --loopback
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Stop server
      if: always()
      shell: bash
      run: kill "$SERVER_PID" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # External peer: connect to a real implementation on another machine.
  # Only runs when peer_host is supplied via workflow_dispatch.
  # Useful for one-click tests against physical hardware, macOS CoreMIDI, or
  # rtpMIDI on Windows running on a self-hosted runner or reachable over LAN.
  # ---------------------------------------------------------------------------
  interop-extended-external:
    name: >
      Extended interop against
      ${{ github.event.inputs.peer_label || 'none' }}
      (${{ github.event.inputs.peer_host || 'N/A' }}:${{ github.event.inputs.peer_port || '5004' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.peer_host != '' }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build InteropTest
      run: dotnet build ../tests/RtpMidi.InteropTest --configuration Release
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Run InteropTest client against external peer
      run: |
        dotnet run --project ../tests/RtpMidi.InteropTest --configuration Release --no-build -- \
          client \
          --host "${{ github.event.inputs.peer_host }}" \
          --port "${{ github.event.inputs.peer_port }}"
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
