name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build RtpMidi.csproj --configuration Release
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: dotnet test ../tests/RtpMidi.Tests/RtpMidi.Tests.csproj --verbosity normal
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

  interop-self:
    name: Interop (self) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build InteropTest
      run: dotnet build ../tests/RtpMidi.InteropTest --configuration Release
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Start InteropTest server (background)
      shell: bash
      run: |
        dotnet run --project ../tests/RtpMidi.InteropTest --configuration Release --no-build -- \
          server --port 5004 &
        echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        sleep 3

    - name: Run InteropTest client (loopback, all 14 checks)
      shell: bash
      run: |
        dotnet run --project ../tests/RtpMidi.InteropTest --configuration Release --no-build -- \
          client --host 127.0.0.1 --port 5004 --loopback
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Stop server
      if: always()
      shell: bash
      run: |
        kill "$SERVER_PID" 2>/dev/null || true
        # On Windows, kill the full process tree so orphaned dotnet children don't
        # hold file locks when actions/checkout runs its post-step git cleanup.
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          sleep 1
          taskkill //F //T //PID "$SERVER_PID" 2>/dev/null || true
        fi

  publish:
    runs-on: ubuntu-latest
    needs: [test, interop-self]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - name: Get main version
      run: echo "MAIN_VERSION=$(jq -r '.version' ../version.json)" >> $GITHUB_ENV
    - name: Get branch name from branch
      run: echo "BRANCH_NAME=$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }' | sed "s/[[:space:]_]/-/g")" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/heads/')
    - name: Get branch name from PR
      run: echo "BRANCH_NAME=PR-$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')" >> $GITHUB_ENV
      if: startsWith(github.ref, 'refs/pull/')

    - run: echo "PACKAGE_VERSION=${MAIN_VERSION}.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      if: github.ref == 'refs/heads/main'
    - run: echo "PACKAGE_VERSION=${MAIN_VERSION}.${GITHUB_RUN_NUMBER}-${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_ENV
      if: github.ref != 'refs/heads/main'
    - run: echo Version is ${PACKAGE_VERSION}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: |
        dotnet build RtpMidi.csproj --configuration Release /p:Version="${PACKAGE_VERSION}"
        dotnet build RtpMidi.Mdns/RtpMidi.Mdns.csproj --configuration Release /p:Version="${PACKAGE_VERSION}"
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    - name: Publish NuGet
      run: |
        dotnet nuget push bin/Release/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_KEY }}
        dotnet nuget push RtpMidi.Mdns/bin/Release/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_KEY }}
    - name: Tag
      run: |
        git tag "v${PACKAGE_VERSION}"
        git push origin "v${PACKAGE_VERSION}"
      if: github.ref == 'refs/heads/main'
